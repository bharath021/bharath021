<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1180"
  height="610"
  viewBox="0 0 1180 610"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Bharath Karumanchi GitHub Hero</title>

  <desc id="description">
    Animated introduction banner for Bharath Karumanchi,
    ML and Full Stack AI Engineer.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed">
        <animate
          attributeName="stop-color"
          values="#7c3aed;#22d3ee;#10b981;#7c3aed"
          dur="6s"
          repeatCount="indefinite"
        />
      </stop>

      <stop offset="100%" stop-color="#22d3ee">
        <animate
          attributeName="stop-color"
          values="#22d3ee;#10b981;#7c3aed;#22d3ee"
          dur="6s"
          repeatCount="indefinite"
        />
      </stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect
    width="1180"
    height="610"
    rx="28"
    fill="url(#background)"
  />

  <rect
    x="20"
    y="20"
    width="1140"
    height="570"
    rx="22"
    fill="none"
    stroke="url(#accent)"
    stroke-width="2"
    opacity="0.8"
  />

  <circle cx="65" cy="62" r="7" fill="#ef4444" />
  <circle cx="90" cy="62" r="7" fill="#f59e0b" />
  <circle cx="115" cy="62" r="7" fill="#22c55e" />

  <text
    x="70"
    y="180"
    fill="#94a3b8"
    font-family="monospace"
    font-size="24"
  >
    $ whoami
  </text>

  <text
    x="70"
    y="245"
    fill="url(#accent)"
    font-family="Arial, sans-serif"
    font-size="54"
    font-weight="700"
    filter="url(#glow)"
  >
    Bharath Karumanchi
  </text>

  <text
    x="70"
    y="305"
    fill="#f8fafc"
    font-family="Arial, sans-serif"
    font-size="29"
    font-weight="600"
  >
    ML &amp; Full Stack AI Engineer
  </text>

  <text
    x="70"
    y="360"
    fill="#94a3b8"
    font-family="monospace"
    font-size="22"
  >
    LLM • RAG • Agentic AI • MLOps • Full-Stack AI
  </text>

  <text
    x="70"
    y="430"
    fill="#22d3ee"
    font-family="monospace"
    font-size="22"
  >
    &gt; Building reliable AI systems
  </text>

  <rect
    x="495"
    y="410"
    width="13"
    height="26"
    fill="#22d3ee"
  >
    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"
    />
  </rect>

  <text
    x="70"
    y="510"
    fill="#64748b"
    font-family="monospace"
    font-size="18"
  >
    Boston, MA • UMass Boston • AWS Certified
  </text>
</svg>
